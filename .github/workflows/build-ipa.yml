name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      eevee_deb_url:
        description: "Optional: direct link to an extra .deb to inject after the mod (e.g. EeveeSpotify). Leave empty to skip."
        required: false
        default: ""
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      # Personal-fork addition: optionally inject one extra .deb (Eevee) into the
      # finished IPA as a second cyan pass, so the artifact is the same combined
      # IPA this fork has always produced. The mod's own pipeline is untouched.
      - name: Inject extra .deb (Eevee)
        if: inputs.eevee_deb_url != ''
        run: |
          curl -fsSL "${{ inputs.eevee_deb_url }}" -o /tmp/extra.deb
          IN="$(ls out/*.ipa | head -1)"
          cyan -i "$IN" -o out/combined.ipa -f /tmp/extra.deb -w -s --overwrite
          rm "$IN"
          mv out/combined.ipa "$IN"
          ls -lh out/

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
